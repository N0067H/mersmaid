[package]
name = "mersmaid"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = ["crates-io"]
description = "A fast native desktop viewer for Mermaid diagrams"
license = "MIT"
repository = "https://github.com/N0067H/mersmaid"
readme = "README.md"
keywords = ["mermaid", "diagram", "viewer", "desktop", "webview"]
categories = ["command-line-utilities", "gui", "visualization"]

[dependencies]
serde_json = "1.0"
tao = "0.37"
wry = "0.57"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
